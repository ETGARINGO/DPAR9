<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="pro9 logo.png">
    <link rel="apple-touch-icon" href="pro9 logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PRO9 DPPAR SYSTEM | TACTICAL ENTRANCE</title>
    
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; background-color: #010b1a; 
            position: fixed; font-family: 'Courier New', Courier, monospace;
        }
        
        iframe {
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; border: none;
            z-index: 1;
        }

        /* --- TACTICAL MAP LOADER --- */
        #loader {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: #000;
            display: flex; align-items: center;
            justify-content: center; z-index: 99;
            overflow: hidden;
            transition: opacity 0.8s ease-in-out;
        }

        /* Map Background for Entrance Only */
        .map-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.4;
            filter: grayscale(1) contrast(1.5) brightness(0.5) sepia(100%) hue-rotate(190deg) saturate(3);
            pointer-events: none;
            transform: scale(1.2);
            animation: mapZoom 3s ease-out forwards;
        }

        @keyframes mapZoom {
            from { transform: scale(1.4); }
            to { transform: scale(1); }
        }

        /* Scanline HUD Overlay */
        #loader::after {
            content: "";
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 100; pointer-events: none;
        }

        .war-container {
            position: relative;
            text-align: center;
            z-index: 101;
            animation: screenShake 0.4s cubic-bezier(.36,.07,.19,.97) both;
            animation-delay: 0.2s;
        }

        .military-logo {
            width: 150px;
            opacity: 0;
            filter: drop-shadow(0 0 20px #0749a0);
            animation: logoSlam 0.3s ease-out forwards;
            animation-delay: 0.2s;
        }

        .crosshair {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 300px; height: 300px;
            border: 1px solid rgba(7, 73, 160, 0.3);
            border-radius: 50%;
            animation: rotateHUD 6s linear infinite;
        }

        @keyframes logoSlam {
            0% { transform: scale(4); opacity: 0; filter: brightness(10) blur(20px); }
            100% { transform: scale(1); opacity: 1; filter: brightness(1); }
        }

        @keyframes rotateHUD {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes screenShake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            30%, 70% { transform: translate3d(-5px, 0, 0); }
            50% { transform: translate3d(5px, 0, 0); }
        }

        .status-text {
            margin-top: 30px;
            color: #00ff00;
            font-size: 0.7rem;
            letter-spacing: 4px;
            text-shadow: 0 0 5px #00ff00;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="loader">
        <img class="map-bg" src="https://images.unsplash.com/photo-1526770146552-517a87756447?auto=format&fit=crop&q=80&w=2000" alt="Tactical Map">
        
        <div class="crosshair"></div>
        
        <div class="war-container">
            <img src="pro9 logo.png" alt="PRO9" class="military-logo">
            <p class="status-text">ACQUIRING REGION IX SIGNAL...</p>
            <div style="width: 200px; height: 2px; background: rgba(7,73,160,0.3); margin: 10px auto; position: relative; overflow: hidden;">
                <div style="position: absolute; width: 100%; height: 100%; background: #0749a0; animation: load 1.5s infinite;"></div>
            </div>
        </div>
    </div>

    <iframe 
        id="secure-frame"
        src="https://script.google.com/macros/s/AKfycby9BxKz9gOqHB4dIOAjp1TXQjx2Nh1r5m4BuiTPlsyhC9GHoPHGN2Ry835NNkc7q-OKVg/exec?p=index" 
        onload="setTimeout(() => { document.getElementById('loader').style.opacity='0'; setTimeout(()=>{document.getElementById('loader').style.display='none'}, 800); }, 2500);">
    </iframe>

    <script>
        @keyframes load { 0% { left: -100%; } 100% { left: 100%; } }

        document.onkeydown = function(e) {
            if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || (e.ctrlKey && (e.keyCode == 85 || e.keyCode == 83))) return false;
        };
    </script>
</body>
</html>
