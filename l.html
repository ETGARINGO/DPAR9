<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="pro9 logo.png">
    <link rel="apple-touch-icon" href="pro9 logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PRO9 TACTICAL COMMAND | REGION IX</title>
    
    <style>
        :root {
            --tactical-blue: #0749a0;
            --hud-green: #00ff41;
            --bg-dark: #010b1a;
            --map-tint: rgba(7, 73, 160, 0.2);
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; background-color: var(--bg-dark); 
            position: fixed; font-family: 'Share Tech Mono', monospace;
        }

        /* --- TACTICAL MAP BACKGROUND --- */
        #map-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            /* High-res Satellite view of Zamboanga region */
            background: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072&auto=format&fit=crop') center/cover no-repeat;
            filter: brightness(0.4) contrast(1.4) saturate(0.5) hue-rotate(180deg);
            z-index: 0;
        }

        /* Scanline & Grid HUD */
        .hud-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%),
                repeating-linear-gradient(90deg, rgba(7, 73, 160, 0.05) 0px, rgba(7, 73, 160, 0.05) 1px, transparent 1px, transparent 60px),
                repeating-linear-gradient(0deg, rgba(7, 73, 160, 0.05) 0px, rgba(7, 73, 160, 0.05) 1px, transparent 1px, transparent 60px);
            background-size: 100% 4px, 60px 60px, 60px 60px;
            pointer-events: none;
            z-index: 2;
        }

        /* Radar Pulse Effect */
        .radar-pulse {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 10px; height: 10px;
            background: var(--hud-green);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--hud-green);
            z-index: 1;
        }
        .radar-pulse::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100px; height: 100px;
            border: 2px solid var(--hud-green);
            border-radius: 50%;
            animation: pulse 3s infinite;
        }

        @keyframes pulse {
            0% { width: 0; height: 0; opacity: 1; }
            100% { width: 800px; height: 800px; opacity: 0; }
        }

        /* --- WAR ENTRANCE LOADER --- */
        #loader {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: #000; display: flex; align-items: center;
            justify-content: center; z-index: 999;
        }

        .military-logo {
            width: 160px;
            filter: drop-shadow(0 0 30px var(--tactical-blue));
            animation: impactSlam 0.4s cubic-bezier(0.17, 0.88, 0.32, 1.28) forwards;
            opacity: 0;
        }

        @keyframes impactSlam {
            0% { transform: scale(5); opacity: 0; filter: brightness(10) blur(20px); }
            100% { transform: scale(1); opacity: 1; filter: brightness(1); }
        }

        /* Frame for System Apps - Glassmorphism */
        #secure-frame {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 92%; height: 85%;
            border: 1px solid rgba(7, 73, 160, 0.5);
            background: rgba(1, 11, 26, 0.85);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(7, 73, 160, 0.2);
            z-index: 5;
            display: none;
            backdrop-filter: blur(15px);
            border-radius: 4px;
        }

        .map-ui {
            position: absolute;
            bottom: 30px; left: 30px;
            z-index: 10;
            color: var(--hud-green);
            text-shadow: 0 0 5px var(--hud-green);
            font-size: 0.8rem;
            pointer-events: none;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="loader">
        <img src="pro9 logo.png" alt="PRO9" class="military-logo">
    </div>

    <div id="map-bg"></div>
    <div class="radar-pulse"></div>
    <div class="hud-overlay"></div>

    <div class="map-ui">
        <div style="color: #fff; letter-spacing: 2px;">STATUS: <span style="color: var(--hud-green);">ENCRYPTED UPLINK</span></div>
        <div id="coords">LAT: 7.5085 | LNG: 122.0792</div>
        <div style="font-size: 0.6rem; color: var(--tactical-blue);">REGION IX DATA STREAM | ZAMBOANGA_PENINSULA</div>
    </div>

    <iframe 
        id="secure-frame"
        src="https://script.google.com/macros/s/AKfycby9BxKz9gOqHB4dIOAjp1TXQjx2Nh1r5m4BuiTPlsyhC9GHoPHGN2Ry835NNkc7q-OKVg/exec?p=index" 
        onload="revealSystem()">
    </iframe>

    <script>
        function revealSystem() {
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.transition = 'opacity 1s ease';
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                    const frame = document.getElementById('secure-frame');
                    frame.style.display = 'block';
                    frame.style.animation = 'fadeIn 1s ease';
                }, 1000);
            }, 1800);
        }

        // Real-time Coordinate Drift
        setInterval(() => {
            const lat = (7.5085 + (Math.random() * 0.005)).toFixed(4);
            const lng = (122.0792 + (Math.random() * 0.005)).toFixed(4);
            document.getElementById('coords').innerText = `LAT: ${lat} | LNG: ${lng}`;
        }, 3000);

        document.onkeydown = (e) => {
            if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || (e.ctrlKey && (e.keyCode == 85 || e.keyCode == 83))) return false;
        };
    </script>
</body>
</html>
