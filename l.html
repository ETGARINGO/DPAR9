<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="pro9 logo.png">
    <link rel="apple-touch-icon" href="pro9 logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PRO9 DPPAR | TACTICAL COMMAND</title>
    
    <style>
        :root {
            --tactical-blue: #0749a0;
            --hud-green: #00ff41;
            --bg-dark: #010b1a;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; background-color: var(--bg-dark); 
            position: fixed; font-family: 'Courier New', Courier, monospace;
        }

        iframe {
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; border: none;
            z-index: 1;
        }

        /* --- TACTICAL ENTRANCE LOADER --- */
        #loader {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: #000;
            display: flex; align-items: center;
            justify-content: center; z-index: 999;
            overflow: hidden;
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Zamboanga Peninsula Map Background (Entrance Only) */
        .map-entrance {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/1/14/Zamboanga_Peninsula_in_Philippines.svg/1200px-Zamboanga_Peninsula_in_Philippines.svg.png');
            background-size: cover;
            background-position: center;
            opacity: 0.2;
            filter: brightness(0.6) contrast(2) saturate(0) sepia(100%) hue-rotate(190deg) blur(2px);
            transform: scale(2);
            animation: mapLockOn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            pointer-events: none;
        }

        @keyframes mapLockOn {
            0% { transform: scale(2.5); filter: brightness(2) blur(10px); opacity: 0; }
            100% { transform: scale(1); filter: brightness(0.6) blur(0px); opacity: 0.2; }
        }

        /* HUD Scanning Lines */
        .hud-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%),
                repeating-linear-gradient(90deg, rgba(7, 73, 160, 0.03) 0px, rgba(7, 73, 160, 0.03) 1px, transparent 1px, transparent 40px);
            background-size: 100% 4px, 40px 100%;
            z-index: 10;
        }

        .war-container {
            position: relative;
            text-align: center;
            z-index: 20;
            animation: impactShake 0.4s ease-out both;
        }

        /* Logo Lightning Strike */
        .military-logo {
            width: 160px;
            opacity: 0;
            filter: drop-shadow(0 0 25px var(--tactical-blue));
            animation: thunderSlam 0.3s cubic-bezier(0.17, 0.88, 0.32, 1.2) forwards;
            animation-delay: 0.1s;
        }

        @keyframes thunderSlam {
            0% { transform: scale(5); opacity: 0; filter: brightness(10) blur(15px); }
            100% { transform: scale(1); opacity: 1; filter: brightness(1); }
        }

        @keyframes impactShake {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-8px, 8px); }
            40% { transform: translate(-8px, -8px); }
            60% { transform: translate(8px, 8px); }
            80% { transform: translate(8px, -8px); }
        }

        /* Tactical HUD Text */
        .status-box {
            margin-top: 25px;
            color: var(--hud-green);
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-shadow: 0 0 8px var(--hud-green);
            text-transform: uppercase;
        }

        .loading-line {
            width: 250px;
            height: 1px;
            background: rgba(0, 255, 65, 0.2);
            margin: 12px auto;
            position: relative;
            overflow: hidden;
        }
        .loading-line::after {
            content: '';
            position: absolute;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--hud-green);
            animation: scanMove 1s linear infinite;
        }

        @keyframes scanMove {
            0% { left: -100%; }
            100% { left: 100%; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="loader">
        <div class="map-entrance"></div>
        <div class="hud-grid"></div>
        
        <div class="war-container">
            <img src="pro9 logo.png" alt="PRO9" class="military-logo">
            <div class="status-box">
                <span id="typing">SECURE UPLINK: REGION IX...</span>
            </div>
            <div class="loading-line"></div>
            <p style="font-size: 0.5rem; color: var(--tactical-blue); letter-spacing: 2px;">COORDINATES: 7.5085° N, 122.0792° E</p>
        </div>
    </div>

    <iframe 
        id="secure-frame"
        src="https://script.google.com/macros/s/AKfycby9BxKz9gOqHB4dIOAjp1TXQjx2Nh1r5m4BuiTPlsyhC9GHoPHGN2Ry835NNkc7q-OKVg/exec?p=index" 
        allowfullscreen
        onload="exitLoader()">
    </iframe>

    <script>
        function exitLoader() {
            // Wait for the animation to be seen, then fade out
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 1000);
            }, 2500);
        }

        // Tactical Protection
        document.onkeydown = (e) => {
            if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || (e.ctrlKey && (e.keyCode == 85 || e.keyCode == 83))) return false;
        };
    </script>
</body>
</html>
