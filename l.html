<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="pro9 logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PRO9 | DPPAR </title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --tactical-blue: #00d4ff;
            --defense-green: #00ff66;
            --bg-black: #00050a;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; background-color: var(--bg-black); 
            font-family: 'Segoe UI', sans-serif;
        }

        #map {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            filter: brightness(0.4) contrast(1.6) saturate(0.6) hue-rotate(185deg);
            background: #000;
        }

        /* --- COMMAND HUD --- */
        #hud {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .corner-bracket {
            position: absolute; width: 40px; height: 40px;
            border: 2px solid var(--tactical-blue);
            opacity: 0.5;
        }
        .top-left { top: 20px; left: 20px; border-right: 0; border-bottom: 0; }
        .top-right { top: 20px; right: 20px; border-left: 0; border-bottom: 0; }

        .aor-header {
            position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
            color: white; text-align: center; letter-spacing: 5px;
        }

        .status-box {
            position: absolute; bottom: 40px; left: 40px;
            color: var(--defense-green); font-family: monospace; font-size: 12px;
            background: rgba(0,0,0,0.7); padding: 15px; border: 1px solid var(--defense-green);
        }

        #secure-frame {
            position: absolute; width: 100%; height: 100%; border: none;
            z-index: 100; opacity: 0; display: none;
            transition: opacity 0.8s ease-in;
        }

        /* Rapid Expand Animation */
        @keyframes expandShield {
            from { stroke-dashoffset: 1000; opacity: 0; }
            to { stroke-dashoffset: 0; opacity: 1; }
        }
        .shield-line { animation: expandShield 1.5s ease-out forwards; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="map"></div>

    <div id="hud">
        <div class="corner-bracket top-left"></div>
        <div class="corner-bracket top-right"></div>

        <div class="aor-header">
            <h1 style="margin:0; font-size: 20px;">REGION IX</h1>
            <div style="color: var(--tactical-blue); font-size: 10px;">DPPAR</div>
        </div>

        <div class="status-box" id="stat-box">
            > INITIALIZING SAT-LINK...<br>
            > SCANNING JURISDICTIONS...<br>
            > <span id="sync-pct">0%</span> ENCRYPTED
        </div>
    </div>

    <iframe id="secure-frame" 
            src="https://script.google.com/macros/s/AKfycby9BxKz9gOqHB4dIOAjp1TXQjx2Nh1r5m4BuiTPlsyhC9GHoPHGN2Ry835NNkc7q-OKVg/exec?p=index" 
            allow="fullscreen; geolocation; camera; microphone;"
            onload="triggerAORZoom()">
    </iframe>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const jurisdictions = [
            { name: "SULU", pos: [6.0, 121.0] },
            { name: "ISABELA", pos: [6.7, 121.9] },
            { name: "ZAMBO CITY", pos: [6.92, 122.07] },
            { name: "SIBUGAY", pos: [7.7, 122.5] },
            { name: "ZAMBO SUR", pos: [7.8, 123.3] },
            { name: "ZAMBO NORTE", pos: [8.2, 123.0] }
        ];

        // Start Zoomed IN at HQ for a dramatic zoom-out
        const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([6.92, 122.07], 13);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);

        async function triggerAORZoom() {
            const syncPct = document.getElementById('sync-pct');
            const statBox = document.getElementById('stat-box');
            
            // 1. Zoom Out to view whole AOR (Fast)
            map.flyTo([7.5, 122.3], 8, { duration: 1.5, easeLinearity: 0.1 });

            // 2. Simultaneous Shield Activation
            setTimeout(() => {
                let coords = jurisdictions.map(j => j.pos);
                
                // Add All City Nodes
                jurisdictions.forEach(j => {
                    L.circleMarker(j.pos, {
                        radius: 5, color: '#fff', fillColor: '#00d4ff', fillOpacity: 1
                    }).addTo(map).bindTooltip(j.name, {permanent: true, direction: 'top', className: 'tactical-label'});
                });

                // Draw Interlocked Polyline
                L.polyline(coords, {
                    color: '#00ff66', weight: 2, opacity: 0.8, dashArray: '10, 10'
                }).addTo(map);

                syncPct.innerText = "100%";
                statBox.innerHTML += "<br>> SHIELD ACTIVE<br>> REDIRECTING...";
            }, 800);

            // 3. Final Transition
            setTimeout(() => {
                const frame = document.getElementById('secure-frame');
                frame.style.display = "block";
                frame.style.opacity = "1";
                document.getElementById('hud').style.opacity = "0";
                
                setTimeout(() => {
                    document.getElementById('map').style.display = "none";
                }, 1000);
            }, 2500);
        }

        document.onkeydown = (e) => { if(e.keyCode == 123 || e.ctrlKey) return false; };
    </script>
</body>
</html>
