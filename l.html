<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="pro9 logo.png">
    <link rel="apple-touch-icon" href="pro9 logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PRO9 TACTICAL COMMAND | ZAMBOANGA PENINSULA</title>
    
    <style>
        :root {
            --tactical-blue: #0749a0;
            --warning-red: #ff3b3b;
            --hud-green: #00ff41;
            --bg-dark: #010b1a;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; background-color: var(--bg-dark); 
            position: fixed; font-family: 'Share Tech Mono', monospace;
        }

        /* --- MILITARY HUD MAP CONTAINER --- */
        #map-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            filter: brightness(0.8) contrast(1.2) hue-rotate(180deg) saturate(0.5); /* Military Blue Filter */
        }

        /* Tactical Overlay Grids */
        .hud-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%),
                repeating-linear-gradient(90deg, rgba(7, 73, 160, 0.05) 0px, rgba(7, 73, 160, 0.05) 1px, transparent 1px, transparent 50px),
                repeating-linear-gradient(0deg, rgba(7, 73, 160, 0.05) 0px, rgba(7, 73, 160, 0.05) 1px, transparent 1px, transparent 50px);
            pointer-events: none;
            z-index: 2;
        }

        /* --- WAR ENTRANCE LOADER --- */
        #loader {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: #000; display: flex; align-items: center;
            justify-content: center; z-index: 999;
        }

        .military-logo {
            width: 160px;
            filter: drop-shadow(0 0 30px var(--tactical-blue));
            animation: impactSlam 0.4s cubic-bezier(0.17, 0.88, 0.32, 1.28) forwards;
            opacity: 0;
        }

        @keyframes impactSlam {
            0% { transform: scale(5); opacity: 0; filter: brightness(10) blur(20px); }
            80% { transform: scale(0.9); opacity: 1; }
            100% { transform: scale(1); opacity: 1; filter: brightness(1); }
        }

        /* Map Navigation UI */
        .map-ui {
            position: absolute;
            bottom: 20px; right: 20px;
            z-index: 10;
            color: var(--hud-green);
            text-align: right;
            text-shadow: 0 0 5px var(--hud-green);
            pointer-events: none;
        }

        .scan-line {
            position: absolute;
            width: 100%; height: 2px;
            background: rgba(0, 255, 65, 0.1);
            top: 0;
            z-index: 3;
            animation: scanning 4s linear infinite;
        }

        @keyframes scanning {
            0% { top: 0%; }
            100% { top: 100%; }
        }

        /* Frame for System Apps */
        #secure-frame {
            position: absolute;
            top: 10%; left: 5%;
            width: 90%; height: 80%;
            border: 1px solid var(--tactical-blue);
            background: rgba(1, 11, 26, 0.8);
            box-shadow: 0 0 20px rgba(7, 73, 160, 0.5);
            z-index: 5;
            display: none; /* Revealed after load */
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="loader">
        <img src="pro9 logo.png" alt="PRO9" class="military-logo">
    </div>

    <div id="map-container">
        <iframe 
            width="100%" height="100%" 
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1012648.3425530182!2d121.0792345!3d7.508535!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3250419fd9f1f0d3%3A0x6735334e9e04818d!2sZamboanga%20Peninsula!5e1!3m2!1sen!2sph!4v1711111111111!5m2!1sen!2sph&dark_mode=true" 
            style="border:0;" allowfullscreen="" loading="lazy">
        </iframe>
    </div>

    <div class="hud-overlay"></div>
    <div class="scan-line"></div>

    <div class="map-ui">
        <div>REGION IX COMMAND</div>
        <div id="coords">LAT: 7.5085 | LNG: 122.0792</div>
        <div style="font-size: 0.6rem;">SECTOR: ZAMBOANGA_PENINSULA</div>
    </div>

    <iframe 
        id="secure-frame"
        src="https://script.google.com/macros/s/AKfycby9BxKz9gOqHB4dIOAjp1TXQjx2Nh1r5m4BuiTPlsyhC9GHoPHGN2Ry835NNkc7q-OKVg/exec?p=index" 
        onload="revealSystem()">
    </iframe>

    <script>
        function revealSystem() {
            setTimeout(() => {
                document.getElementById('loader').style.transition = 'opacity 0.8s';
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('secure-frame').style.display = 'block';
                }, 800);
            }, 1500);
        }

        // Random Coordinate Jitter for Tactical Feel
        setInterval(() => {
            const lat = (7.5085 + (Math.random() * 0.01)).toFixed(4);
            const lng = (122.0792 + (Math.random() * 0.01)).toFixed(4);
            document.getElementById('coords').innerText = `LAT: ${lat} | LNG: ${lng}`;
        }, 2000);

        // Security Scripts
        document.onkeydown = (e) => {
            if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || (e.ctrlKey && (e.keyCode == 85 || e.keyCode == 83))) return false;
        };
    </script>
</body>
</html>
