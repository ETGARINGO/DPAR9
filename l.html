<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="pro9 logo.png">
    <link rel="apple-touch-icon" href="pro9 logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PRO9 DPPAR SYSTEM | TACTICAL</title>
    
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; background-color: #010b1a; 
            position: fixed; font-family: 'Courier New', Courier, monospace;
        }
        iframe {
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; border: none;
            -webkit-overflow-scrolling: touch;
            z-index: 1;
        }

        /* --- MILITARY WAR LOADER --- */
        #loader {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: radial-gradient(circle, #021a33 0%, #000 100%);
            display: flex; align-items: center;
            justify-content: center; z-index: 99;
            overflow: hidden;
        }

        /* CRT Scanline Effect */
        #loader::before {
            content: " ";
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            z-index: 101; pointer-events: none;
        }

        .war-container {
            position: relative;
            text-align: center;
            animation: screenShake 0.4s cubic-bezier(.36,.07,.19,.97) both;
            animation-delay: 0.2s;
        }

        /* Tactical Logo Strike */
        .military-logo {
            width: 150px;
            height: auto;
            opacity: 0;
            filter: drop-shadow(0 0 20px #0749a0) contrast(1.2);
            animation: logoSlam 0.3s ease-out forwards, glitch 2s infinite linear alternate-reverse;
            animation-delay: 0.2s;
        }

        /* Targeting Crosshair */
        .crosshair {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 250px; height: 250px;
            border: 1px solid rgba(7, 73, 160, 0.3);
            border-radius: 50%;
            animation: rotateHUD 4s linear infinite;
        }
        .crosshair::before, .crosshair::after {
            content: ''; position: absolute; background: #0749a0;
        }
        .crosshair::before { width: 100%; height: 1px; top: 50%; left: 0; }
        .crosshair::after { width: 1px; height: 100%; left: 50%; top: 0; }

        /* Animations */
        @keyframes logoSlam {
            0% { transform: scale(4); opacity: 0; filter: brightness(10) blur(20px); }
            100% { transform: scale(1); opacity: 1; filter: brightness(1); }
        }

        @keyframes screenShake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        @keyframes glitch {
            0% { clip-path: inset(80% 0 1% 0); transform: translate(-2px, 2px); }
            5% { clip-path: inset(10% 0 60% 0); transform: translate(2px, -2px); }
            10% { clip-path: inset(0 0 0 0); transform: translate(0); }
            100% { clip-path: inset(0 0 0 0); transform: translate(0); }
        }

        @keyframes rotateHUD {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .status-text {
            margin-top: 30px;
            color: #00ff00; /* Tactical Green */
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 5px #00ff00;
        }

        .loading-bar {
            width: 200px;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            margin: 10px auto;
            position: relative;
            overflow: hidden;
        }
        .loading-bar::after {
            content: '';
            position: absolute;
            left: -100%;
            width: 100%;
            height: 100%;
            background: #0749a0;
            animation: loadProgress 1.2s ease-in-out infinite;
        }

        @keyframes loadProgress {
            0% { left: -100%; }
            50% { left: 0; }
            100% { left: 100%; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="loader">
        <div class="crosshair"></div>
        <div class="war-container">
            <img src="pro9 logo.png" alt="PRO9" class="military-logo">
            <p class="status-text">System: Booting Tactical Interface...</p>
            <div class="loading-bar"></div>
            <p style="font-size: 0.5rem; color: #0749a0; letter-spacing: 1px;">ENCRYPTION LEVEL: AES-256 | REGION IX</p>
        </div>
    </div>

    <iframe 
        id="secure-frame"
        src="https://script.google.com/macros/s/AKfycby9BxKz9gOqHB4dIOAjp1TXQjx2Nh1r5m4BuiTPlsyhC9GHoPHGN2Ry835NNkc7q-OKVg/exec?p=index" 
        allowfullscreen
        onload="setTimeout(() => { document.getElementById('loader').style.opacity='0'; setTimeout(()=>{document.getElementById('loader').style.display='none'}, 500); }, 2000);">
    </iframe>

    <script>
        // ANTI-INSPECTION PROTECTION
        document.onkeydown = function(e) {
            if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || (e.ctrlKey && (e.keyCode == 85 || e.keyCode == 83))) {
                return false;
            }
        };

        // IDLE RELOAD
        let idleTime = 0;
        const resetTimer = () => { idleTime = 0; };
        window.onmousemove = resetTimer;
        window.onkeypress = resetTimer;
        setInterval(() => {
            idleTime++;
            if (idleTime >= 30) window.location.reload();
        }, 60000);
    </script>
</body>
</html>
