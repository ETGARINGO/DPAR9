<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="Video.gif">
    <link rel="apple-touch-icon" href="Video.gif">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PRO9 | PERSONNEL DATA VERIFIER</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --tactical-blue: #00d4ff;
            --defense-green: #00ff66;
            --alert-amber: #ffaa00;
            --bg-black: #010b1a;
            --card-bg: rgba(2, 18, 41, 0.85);
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            overflow: hidden; background-color: var(--bg-black); 
            position: fixed; font-family: 'Segoe UI', -apple-system, sans-serif;
            user-select: none;
        }

        #map {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; filter: brightness(0.4) contrast(1.5) saturate(0.5) hue-rotate(185deg);
        }

        /* DATABASE */
        #hud {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; 
            background: radial-gradient(circle, transparent 20%, rgba(1, 11, 26, 0.95) 100%);
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-sizing: border-box;
            padding: 20px;
        }

        .header-main {
            text-align: center; color: white; text-transform: uppercase;
            margin-bottom: 30px;
        }
        
        .entrance-logo {
            width: 110px;
            height: auto;
            filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.6));
            margin-bottom: 15px;
        }

        .header-main h1 { 
            margin: 0; font-size: 1.5rem; letter-spacing: 6px; font-weight: 900; 
            text-shadow: 0 0 15px var(--tactical-blue); 
        }

        /* CONTROL INTERFACE */
        .control-panel {
            display: flex;
            gap: 20px;
            max-width: 800px;
            width: 100%;
            justify-content: center;
            z-index: 15;
            pointer-events: auto;
        }

        .tactical-card {
            background: var(--card-bg);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 8px;
            padding: 25px;
            flex: 1;
            max-width: 340px;
            text-align: center;
            color: #ffffff;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(0, 212, 255, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .tactical-card::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--tactical-blue), transparent);
            transition: 0.5s;
        }

        .tactical-card:hover::before { left: 100%; }

        .tactical-card:hover {
            border-color: var(--tactical-blue);
            transform: translateY(-5px);
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.3), inset 0 0 20px rgba(0, 212, 255, 0.1);
        }

        .card-icon {
            font-size: 24px; margin-bottom: 10px; color: var(--tactical-blue);
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .tactical-card h2 {
            margin: 0 0 10px 0; font-size: 1.1rem; letter-spacing: 2px;
            font-weight: 700; text-transform: uppercase;
        }

        .tactical-card p {
            margin: 0 0 20px 0; font-size: 0.8rem; color: #a0aec0;
            line-height: 1.4; min-height: 45px;
        }

        .launch-btn {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid var(--tactical-blue);
            color: var(--tactical-blue);
            padding: 12px 24px;
            border-radius: 4px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            font-size: 0.8rem;
        }

        .launch-btn:hover {
            background: var(--tactical-blue);
            color: var(--bg-black);
            box-shadow: 0 0 15px var(--tactical-blue);
        }

        /* STATUS FOOTER */
        .hud-status {
            margin-top: 40px;
            font-size: 0.65rem;
            letter-spacing: 3px;
            color: var(--defense-green);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 6px; height: 6px; background: var(--defense-green);
            border-radius: 50%; box-shadow: 0 0 8px var(--defense-green);
        }

        /* MAP LABELS */
        .tactical-label {
            background: rgba(0, 20, 40, 0.9) !important;
            border: 1px solid var(--tactical-blue) !important;
            color: #fff !important;
            font-weight: 900 !important;
            font-family: monospace !important;
            font-size: 11px !important;
            padding: 3px 8px !important;
            border-radius: 3px !important;
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.4);
            text-transform: uppercase;
        }

        @keyframes nodePulse { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(3); opacity: 0; } }
        .pulse-ring { border: 2px solid var(--defense-green); border-radius: 50%; animation: nodePulse 1.8s infinite; }

        #secure-frame {
            position: absolute; width: 100%; height: 100%; border: none;
            z-index: 100; opacity: 0; visibility: hidden;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* LOADING LOADER OVERLAY */
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-black); z-index: 99; display: none;
            align-items: center; justify-content: center; flex-direction: column;
            color: white; letter-spacing: 4px; font-size: 0.8rem; font-weight: 700;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .spinner {
            border: 3px solid rgba(255,255,255,0.05); border-top: 3px solid var(--tactical-blue);
            border-radius: 50%; width: 45px; height: 45px; animation: spin 0.8s linear infinite;
            margin-bottom: 15px; box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="map"></div>

    <div id="hud">
        <img src="pro9 logo.png" alt="PRO9 Logo" class="entrance-logo">
        <div class="header-main">
            <h1>POLICE REGIONAL OFFICE 9</h1>
            <p style="font-size: 0.6rem; letter-spacing: 3px; color: var(--tactical-blue); margin-top: 5px;">COMMAND MONITORING</p>
        </div>

        <!-- CONTROL PANEL SWITCHER -->
        <div class="control-panel">
            <div class="tactical-card">
                <div>
                    <div class="card-icon">⚡</div>
                    <h2>DPPAR</h2>
                    <p>Daily PNP Personnel Accounting Report</p>
                </div>
                <button class="launch-btn" onclick="initiateSystem('verifier')">ACCESS RECORD</button>
            </div>

            <div class="tactical-card">
                <div>
                    <div class="card-icon">🛰️</div>
                    <h2>Personnel Verifier</h2>
                    <p>Assignment & Contact information</p>
                </div>
                <button class="launch-btn" onclick="initiateSystem('dppar')">ACCESS RECORD</button>
            </div>
        </div>

        <div class="hud-status">
            <div class="status-dot"></div> Secure Terminal Online & Encrypted
        </div>
    </div>

    <!-- TRANSLUCENT TERMINAL LOADING STAGE -->
    <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="load-text">ESTABLISHING QUANTUM TUNNEL...</div>
    </div>

    <!-- SECURED IFRAME HOST -->
    <iframe id="secure-frame" 
            src="about:blank"
            allow="geolocation; camera; microphone; fullscreen; autoplay; display-capture;">
    </iframe>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const SYSTEM_URLS = {
            verifier: "https://script.google.com/macros/s/AKfycbx6KDaMtzGRGgSJbPLlYvH4N2K6Z9bbYjLIigbYELWE5RytgdYp6Fd6HHL8M1GOixiX/exec",
            dppar: "https://script.google.com/macros/s/AKfycbyTp4sVs0g75P0EG0teZLgdsIdvFRCCU-bJBTHSSkgxdgNrJzQPNvZrOqd7JMoZZbfBOg/exec"
        };

        const jurisdictions = [
            { n: "SULU", p: [6.0, 121.0] },
            { n: "ISABELA", p: [6.7, 121.9] },
            { n: "ZAMBO CITY", p: [6.92, 122.07] },
            { n: "SIBUGAY", p: [7.7, 122.5] },
            { n: "ZAMBO SUR", p: [7.8, 123.3] },
            { n: "ZAMBO NORTE", p: [8.2, 123.0] }
        ];

        // Map setup
        const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([6.92, 122.07], 9);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}').addTo(map);

        jurisdictions.forEach(j => {
            L.circleMarker(j.p, { radius: 5, color: '#fff', fillColor: '#00d4ff', fillOpacity: 1, weight: 2 }).addTo(map)
             .bindTooltip(j.n, { permanent: true, direction: 'right', offset: [12, 0], className: 'tactical-label' });
            
            L.circleMarker(j.p, { radius: 15, color: '#00ff66', weight: 1, fillOpacity: 0, className: 'pulse-ring' }).addTo(map);
        });

        // Trigger loading and animation chain
        function initiateSystem(targetKey) {
            const chosenUrl = SYSTEM_URLS[targetKey];
            const hud = document.getElementById('hud');
            const frame = document.getElementById('secure-frame');
            const overlay = document.getElementById('loading-overlay');
            const loadText = document.getElementById('load-text');

            // Turn off pointer events during transitions
            hud.style.pointerEvents = "none";
            
            // Map sweeps across target operational vector
            map.flyTo([7.4, 122.3], 8, { duration: 0.8, easeLinearity: 0.2 });

            setTimeout(() => {
                hud.style.opacity = "0";
                overlay.style.display = "flex";
                loadText.innerText = `CONNECTING SECURE ENGINE [${targetKey.toUpperCase()}]...`;

                // Set source URL and prepare clean presentation on frame finish loading
                frame.src = chosenUrl;
                
                frame.onload = () => {
                    overlay.style.opacity = "0";
                    setTimeout(() => overlay.remove(), 400);

                    frame.style.visibility = "visible";
                    frame.style.opacity = "1";
                    
                    // Clear memory footprint from unneeded DOM layers safely
                    setTimeout(() => { 
                        document.getElementById('map').remove();
                        hud.remove();
                    }, 500);
                };
            }, 600);
        }

        // Anti-inspect defense matrices 
        document.onkeydown = function(e) {
            if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || (e.ctrlKey && (e.keyCode == 85 || e.keyCode == 83))) {
                return false;
            }
        };

        // Screen protection automated refresh loops
        let idleTime = 0;
        const reset = () => idleTime = 0;
        ['mousemove', 'keypress', 'touchstart'].forEach(evt => window.addEventListener(evt, reset));

        setInterval(() => {
            idleTime++;
            if (idleTime >= 30) window.location.reload();
        }, 60000);
    </script>
</body>
</html>
